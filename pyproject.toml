[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentD"
version = "0.1.0"
description = "Production-grade LLM agent framework with session logging and memory"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "AgentD Contributors"}]
requires-python = ">=3.11"
keywords = ["llm", "agent", "langchain", "langgraph", "claude", "deepagents", "pentesting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Core agent framework
    "langchain>=1.0.0",
    "langgraph>=1.1.0",
    "langchain-anthropic>=0.1.0",
    "pydantic>=2.0",
    "httpx>=0.24.0",
    # TUI engine
    "deepagents>=0.6.1",
    "deepagents-cli>=0.0.59",
    # LLM providers (HTTP + claude/copilot CLI — all Termux-compatible)
    "anthropic>=0.52.0",
    "openai>=1.0.0",
    "ollama>=0.6.0",
    # Storage & persistence
    "aiosqlite>=0.19.0",
    "sqlalchemy>=2.0.0",
    # SQLite checkpointer (persistence.py imports langgraph.checkpoint.sqlite).
    # Not pulled transitively by the lean core, so declare it explicitly.
    "langgraph-checkpoint-sqlite>=2.0.0",
    # Observability
    "langsmith>=0.1.0",
    # Utilities
    "textual>=0.20.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "black>=23.0",
    "ruff>=0.1.0",
]
# Browser automation. NOT installable/usable on Termux: Playwright's bundled
# Chromium is a glibc ELF and won't run on Android's bionic libc. Desktop only.
browser = [
    "browser-use>=0.12.0",
    "playwright>=1.50.0",
]
# HTTP research tools (firecrawl/tavily). Pure HTTP — work on Termux too, but
# kept optional so the lean core install stays small.
research = [
    "firecrawl-py>=0.0.1",
    "tavily-python>=0.3.0",
]
# Full desktop (glibc) experience: browser automation + research tools.
full = [
    "browser-use>=0.12.0",
    "playwright>=1.50.0",
    "firecrawl-py>=0.0.1",
    "tavily-python>=0.3.0",
]

[project.scripts]
D = "agentd.cli:main_d"
agentd = "agentd.cli:main"

[tool.setuptools]
packages = ["agentd"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
