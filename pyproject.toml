[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentD"
version = "0.1.0"
description = "Production-grade LLM agent framework with session logging and memory"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "AgentD Contributors"}]
requires-python = ">=3.10"
keywords = ["llm", "agent", "langchain", "langgraph", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "langchain>=0.1.0",
    "langgraph>=0.0.1",
    "textual>=0.20.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
D = "agentd.cli:main_d"
agentd = "agentd.cli:main"

[tool.setuptools]
packages = ["agentd"]
